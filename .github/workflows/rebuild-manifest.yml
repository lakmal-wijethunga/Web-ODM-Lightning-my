name: Rebuild manifest

# The releases are the source of truth — each one carries its metadata in its
# body. This keeps docs/manifest.json in step when a release is published,
# edited, or deleted outside the local uploader (e.g. through the GitHub UI).
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-manifest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --omit=dev

      - name: Regenerate docs/manifest.json from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: node uploader/bin/rebuild-manifest.js
