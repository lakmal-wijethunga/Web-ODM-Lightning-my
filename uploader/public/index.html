<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebODM Backup Hub — Uploader</title>
<style>
  :root{
    --bg:#11161d; --panel:#171e27; --panel-2:#1e2732; --line:#2a3644;
    --text:#e6edf5; --muted:#8899ad; --accent:#2c7be5; --accent-dim:#1b5bb0;
    --ok:#2fbf71; --warn:#e0a13c; --err:#e05c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;
    display:flex;align-items:center;gap:12px}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .repo{margin-left:auto;color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
  main{max-width:820px;margin:0 auto;padding:26px 22px 60px}

  #drop{border:2px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;
    background:var(--panel);transition:.15s;cursor:pointer}
  #drop:hover,#drop.over{border-color:var(--accent);background:var(--panel-2)}
  #drop h2{margin:0 0 6px;font-size:17px;font-weight:600}
  #drop p{margin:0;color:var(--muted);font-size:13px}
  #drop .or{display:block;margin:14px 0 0;font-size:12px;color:var(--muted)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin-top:18px}
  .card h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}

  .grid{display:grid;grid-template-columns:130px 1fr;gap:9px 16px;font-size:13px}
  .grid dt{color:var(--muted)}
  .grid dd{margin:0;font-family:ui-monospace,monospace;word-break:break-word}

  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  input[type=text]{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:14px;margin-bottom:14px}
  .row>div{flex:1}

  button{background:var(--accent);color:#fff;border:0;padding:10px 20px;border-radius:7px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){background:var(--accent-dim)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.warn{background:rgba(224,161,60,.16);color:var(--warn)}
  .pill.ok{background:rgba(47,191,113,.16);color:var(--ok)}

  .bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .bar.total>i{background:var(--ok)}
  .prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
    font-family:ui-monospace,monospace}

  #log{font-family:ui-monospace,monospace;font-size:12px;max-height:260px;overflow:auto;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin-top:12px}
  #log div{padding:1px 0;color:var(--muted);white-space:pre-wrap}
  #log div.warn{color:var(--warn)}
  #log div.err{color:var(--err)}
  #log div.ok{color:var(--ok)}

  a{color:var(--accent)}
  .hidden{display:none}
  code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>WebODM Backup Hub</h1>
  <span class="repo" id="repo">…</span>
</header>

<main>
  <div id="drop">
    <h2>Select a WebODM task backup</h2>
    <p>The <code>.zip</code> from Download Assets → Backup</p>
    <span class="or">Click to browse — or drag a file here</span>
  </div>

  <section id="details" class="card hidden">
    <h3>What's in this backup</h3>
    <dl class="grid" id="meta"></dl>

    <div class="row" style="margin-top:18px">
      <div>
        <label for="project">Project</label>
        <input type="text" id="project" placeholder="e.g. Site A" list="projects">
        <datalist id="projects"></datalist>
      </div>
      <div>
        <label for="taskname">Task name</label>
        <input type="text" id="taskname">
      </div>
    </div>
    <button id="go">Upload to GitHub</button>
    <button id="cancel" class="ghost">Choose a different file</button>
  </section>

  <section id="progress" class="card hidden">
    <h3>Uploading</h3>
    <div class="prog-label"><span id="curName">—</span><span id="curPct"></span></div>
    <div class="bar"><i id="curBar"></i></div>
    <div class="prog-label" style="margin-top:14px"><span>Total</span><span id="totPct"></span></div>
    <div class="bar total"><i id="totBar"></i></div>
    <div id="log"></div>
  </section>

  <section id="done" class="card hidden">
    <h3>Done</h3>
    <div id="doneBody"></div>
  </section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const fmt = (n) => {
  if (n == null) return '—';
  const u = ['B','KB','MB','GB','TB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
};

let cfg = {}, current = null;

cfg = await (await fetch('/api/config')).json();
$('repo').textContent = cfg.repo;

// Remember project names locally so the datalist is useful on repeat uploads.
const recalled = JSON.parse(localStorage.getItem('projects') || '[]');
$('projects').innerHTML = recalled.map((p) => `<option value="${p}">`).join('');

function log(msg, cls = '') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = msg;
  $('log').append(d);
  $('log').scrollTop = $('log').scrollHeight;
}

async function loadPath(p) {
  $('drop').innerHTML = '<h2>Reading backup…</h2><p>Scanning the archive index</p>';
  try {
    const info = await (await fetch('/api/inspect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: p }),
    })).json();
    if (info.error) throw new Error(info.error);
    current = { path: p, info };
    render(info);
  } catch (err) {
    resetDrop();
    alert('Could not read that file:\n\n' + err.message);
  }
}

function render(info) {
  const rows = [
    ['File size', `${info.sizeLabel}${info.willSplit ? ` <span class="pill warn">splits into ${info.partCount} parts</span>` : ''}`],
    ['Format', info.recognised
      ? '<span class="pill ok">WebODM backup</span>'
      : '<span class="pill warn">no backup.json — using filename</span>'],
    ['Captured', info.createdAt ? new Date(info.createdAt).toLocaleString() : '—'],
    ['Images', info.imageCount ?? '—'],
    ['Map preview', info.hasFootprint ? 'yes' : 'no georeferencing'],
    ['Assets found', info.available.map((a) => a.name).join(', ') || '—'],
  ];
  $('meta').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('taskname').value = info.name || '';
  $('drop').classList.add('hidden');
  $('details').classList.remove('hidden');
}

function resetDrop() {
  $('drop').innerHTML =
    '<h2>Select a WebODM task backup</h2>' +
    '<p>The <code>.zip</code> from Download Assets → Backup</p>' +
    '<span class="or">Click to browse — or drag a file here</span>';
  $('drop').classList.remove('hidden');
  $('details').classList.add('hidden');
}

// Click → native OS picker, which gives a real path and avoids copying GBs.
$('drop').addEventListener('click', async () => {
  if (!cfg.canPickNatively) return alert('Drag the backup file onto this box.');
  const r = await (await fetch('/api/browse', { method: 'POST' })).json();
  if (!r.cancelled && r.path) loadPath(r.path);
});

$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', async (e) => {
  e.preventDefault();
  $('drop').classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (!file) return;

  // The browser hides the real path, so the bytes must be staged to disk.
  // Loopback is fast, but for very large files the native picker is better.
  $('drop').innerHTML = `<h2>Staging ${file.name}…</h2><p>${fmt(file.size)} — copying locally</p>`;
  const r = await (await fetch(`/api/stage?name=${encodeURIComponent(file.name)}`, {
    method: 'POST', body: file,
  })).json();
  loadPath(r.path);
});

$('cancel').addEventListener('click', resetDrop);

$('go').addEventListener('click', async () => {
  const project = $('project').value.trim() || 'Unsorted';
  const name = $('taskname').value.trim();

  if (!recalled.includes(project)) {
    recalled.push(project);
    localStorage.setItem('projects', JSON.stringify(recalled));
  }

  $('details').classList.add('hidden');
  $('progress').classList.remove('hidden');

  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: current.path, project, name }),
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const frames = buf.split('\n\n');
    buf = frames.pop();
    for (const f of frames) {
      if (!f.startsWith('data: ')) continue;
      handle(JSON.parse(f.slice(6)));
    }
  }
});

function handle(ev) {
  if (ev.type === 'log') log(ev.message, ev.level === 'warn' ? 'warn' : '');
  if (ev.type === 'plan') log(`Plan: ${ev.jobs.length} assets, ${fmt(ev.totalBytes)} total.`);

  if (ev.type === 'progress') {
    $('curName').textContent = ev.asset;
    const a = Math.round((ev.assetSent / ev.assetTotal) * 100);
    const t = Math.round((ev.done / ev.totalBytes) * 100);
    $('curBar').style.width = a + '%';
    $('totBar').style.width = t + '%';
    $('curPct').textContent = `${fmt(ev.assetSent)} / ${fmt(ev.assetTotal)} · ${a}%`;
    $('totPct').textContent = `${fmt(ev.done)} / ${fmt(ev.totalBytes)} · ${t}%`;
  }

  if (ev.type === 'error') log('ERROR: ' + ev.message, 'err');

  if (ev.type === 'done') {
    log('Upload complete.', 'ok');
    $('done').classList.remove('hidden');
    $('doneBody').innerHTML = `
      <p>Archived as <code>${ev.tag}</code>.</p>
      <p><a href="${ev.releaseUrl}" target="_blank" rel="noopener">View the GitHub release</a></p>
      <p><a href="${ev.pagesUrl}" target="_blank" rel="noopener">Open the dashboard</a>
         — GitHub Pages takes up to a minute to rebuild.</p>
      ${ev.split ? `<p class="pill warn">Split into ${ev.parts.length} parts</p>
      <p>The dashboard shows the rejoin command for downloaders.</p>` : ''}
      <p style="margin-top:16px"><button onclick="location.reload()">Upload another</button></p>`;
  }
}
</script>
</body>
</html>
